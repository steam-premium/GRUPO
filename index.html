<head>
<meta charset="UTF-8">

<title>Grupo VIP de Promoções Gamer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#08050a;
    --bg-1:#160610;
    --red:#ff2b3d;
    --red-dim:#6a0f1c;
    --ink:#f3eef0;
    --ink-dim:#a99aa3;
    --wa:#22c55e;
    --wa-dark:#0f7a3d;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{
    height:100dvh;
    width:100vw;
    background:
      radial-gradient(60% 55% at 50% 0%, rgba(255,43,61,0.30), transparent 65%),
      radial-gradient(90% 60% at 50% 100%, rgba(120,10,30,0.35), transparent 70%),
      var(--bg-0);
    color:var(--ink);
    font-family:Rajdhani, "Segoe UI", Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:clamp(16px,4vh,32px) clamp(16px,6vw,40px);
    position:relative;
  }
  body::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,43,61,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,43,61,0.06) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(75% 60% at 50% 40%, #000 40%, transparent 85%);
    pointer-events:none;
  }
  .mark{
    width:56px;height:56px;
    margin-bottom:clamp(10px,2.2vh,18px);
    filter:drop-shadow(0 0 10px rgba(255,43,61,0.6));
    position:relative;
    z-index:1;
  }
  h1{
    font-weight:700;
    font-size:clamp(1.6rem, 5.4vw, 2.7rem);
    line-height:1.12;
    letter-spacing:0.3px;
    max-width:15ch;
    text-wrap:balance;
    color:var(--ink);
    text-shadow:0 0 22px rgba(255,43,61,0.35);
    position:relative;
    z-index:1;
  }
  h1 span{color:var(--red);}
  p.sub{
    margin-top:clamp(8px,1.8vh,14px);
    font-size:clamp(0.85rem, 2.6vw, 1.05rem);
    color:var(--ink-dim);
    font-weight:600;
    max-width:34ch;
    position:relative;
    z-index:1;
  }
  .cta{
    margin-top:clamp(20px,4vh,34px);
    display:inline-flex;
    align-items:center;
    gap:12px;
    padding:clamp(14px,2.4vh,20px) clamp(24px,5vw,44px);
    border-radius:16px;
    background:linear-gradient(180deg, #34e07f, var(--wa) 50%, var(--wa-dark));
    color:#06210f;
    font-weight:700;
    font-size:clamp(1rem, 3.4vw, 1.3rem);
    letter-spacing:0.3px;
    text-decoration:none;
    border:1px solid rgba(255,255,255,0.35);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.45) inset,
      0 -12px 18px rgba(0,0,0,0.18) inset,
      0 10px 26px rgba(34,197,94,0.38),
      0 0 44px rgba(34,197,94,0.24);
    position:relative;
    z-index:1;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .cta svg{width:26px;height:26px;flex:none;}
  .cta:hover{
    transform:translateY(-2px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.5) inset,
      0 -12px 18px rgba(0,0,0,0.18) inset,
      0 14px 30px rgba(34,197,94,0.45),
      0 0 54px rgba(34,197,94,0.3);
  }
  .cta:active{ transform:translateY(0) scale(0.97); }
  .row{
    margin-top:clamp(20px,4.2vh,36px);
    display:flex;
    gap:clamp(14px,3.5vw,28px);
    position:relative;
    z-index:1;
  }
  .item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    color:var(--ink-dim);
    font-size:clamp(0.6rem,1.9vw,0.75rem);
    font-weight:600;
    max-width:90px;
  }
  .item svg{width:20px;height:20px;color:var(--red);}
  .note{
    margin-top:clamp(20px,4.2vh,36px);
    position:relative;
    z-index:1;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:clamp(0.78rem,2.2vw,0.95rem);
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--ink-dim);
  }
  .note::before{
    content:"";
    width:8px;
    height:8px;
    flex:none;
    border-radius:50%;
    background:var(--wa);
    box-shadow:0 0 8px 1px rgba(34,197,94,0.9);
    animation:dot-blink 1.5s ease-in-out infinite;
  }
  @keyframes dot-blink{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.4;transform:scale(.8)}
  }
</style>
</head>
