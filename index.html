      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 50% 45%, rgba(0, 255, 140, 0.10), transparent 35%),
        radial-gradient(circle at 10% 90%, rgba(0, 255, 140, 0.06), transparent 30%),
        #050807;
      position: relative;
      isolation: isolate;
    }

    /* GRID GAMER */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(0, 255, 140, 0.08) 1px, transparent 1px),

    /* BRILHO CENTRAL */
    body::after {
      content: "";
      position: absolute;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: rgba(0, 255, 140, 0.08);
      filter: blur(100px);
      z-index: -1;

      color: #00ff88;
      font-size: 11px;

      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow:
        inset 0 0 15px rgba(0, 255, 136, 0.03),

    }

    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 10px #00ff88;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% {

      }
      50% {
        opacity: 0.35;
      }
    }

    h1 {

    /* BOTÃO GAMER */
    .whatsapp-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 460px;
      min-height: 68px;
      padding: 17px 28px;
      overflow: hidden;

      border: 1px solid #00ff88;
      border-radius: 6px;

      background:
        linear-gradient(
          135deg,
          #00ff88 0%,
          #00d96f 50%,
          #00b85d 100%
        );

      color: #031009;
      text-decoration: none;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.8px;

      box-shadow:
        0 0 0 1px rgba(0, 255, 136, 0.12),
        0 0 20px rgba(0, 255, 136, 0.22),
        0 10px 40px rgba(0, 0, 0, 0.45);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
    }

    /* EFEITO DE LUZ PASSANDO */
    .whatsapp-button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.35),
        transparent
      );
      transform: skewX(-20deg);
      animation: shine 3.5s infinite;
    }

    @keyframes shine {
      0% {
        left: -100%;
      }

      35%, 100% {
        left: 150%;
      }
    }

    .whatsapp-button:hover {
      transform: translateY(-3px) scale(1.01);
      filter: brightness(1.08);
      box-shadow:
        0 0 0 1px rgba(0, 255, 136, 0.3),
        0 0 30px rgba(0, 255, 136, 0.4),
        0 15px 45px rgba(0, 0, 0, 0.5);
    }

    .whatsapp-button:active {
      transform: translateY(0) scale(0.99);
    }

    .whatsapp-icon {
      width: 25px;
      height: 25px;
      margin-right: 11px;
      position: relative;
      z-index: 2;
      flex-shrink: 0;
    }

    .button-text {
      position: relative;
      z-index: 2;
    }

    .footer-text {
      margin-top: 19px;
      color: rgba(255, 255, 255, 0.32);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* CANTOS DECORATIVOS */
    .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: rgba(0, 255, 136, 0.35);
      border-style: solid;
    }

    .corner.top-left {
      top: -25px;
      left: -25px;
      border-width: 1px 0 0 1px;
    }

    .corner.top-right {
      top: -25px;
      right: -25px;
      border-width: 1px 1px 0 0;
    }

    .corner.bottom-left {
      bottom: -25px;
      left: -25px;
      border-width: 0 0 1px 1px;
    }

    .corner.bottom-right {
      bottom: -25px;
      right: -25px;
      border-width: 0 1px 1px 0;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px;
      }

      .container {
        max-width: 100%;
      }

      .corner {
        display: none;
      }

      .top-line {
        margin-bottom: 18px;
      }

      .badge {
        margin-bottom: 19px;
        font-size: 10px;
      }

      h1 {
        font-size: clamp(32px, 10vw, 48px);
        letter-spacing: -1.5px;
      }

        margin-bottom: 27px;

      }

        min-height: 62px;
        font-size: 14px;
        padding: 15px 18px;
      }

      .footer-text {
        margin-top: 15px;
      }
    }
  </style>
</head>
