<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entre no grupo do WhatsApp</title>
<meta name="description" content="Entre no nosso grupo do WhatsApp e receba novidades, avisos e conteúdos em primeira mão.">
<meta name="theme-color" content="#05302A">
<meta property="og:title" content="Entre no grupo do WhatsApp">
<meta property="og:description" content="Receba novidades, avisos e conteúdos em primeira mão direto no seu WhatsApp.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%2325D366'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#05302A;
  --bg-deep:#031F1B;
  --wa:#25D366;
  --wa-dark:#128C7E;
  --ink:#F2F8F5;
  --ink-soft:rgba(242,248,245,.74);
  --btn-text:#04241E;
}
*,*::before,*::after{box-sizing:border-box}
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
}
body{
  height:100vh;
  height:100dvh;
  display:grid;
  place-items:center;
  padding:
    max(16px,env(safe-area-inset-top))
    max(20px,env(safe-area-inset-right))
    max(16px,env(safe-area-inset-bottom))
    max(20px,env(safe-area-inset-left));
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(70vmax 55vmax at 50% -8%,rgba(37,211,102,.24),transparent 62%),
    radial-gradient(55vmax 50vmax at 105% 105%,rgba(18,140,126,.38),transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg-deep));
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
main{
  width:min(100%,560px);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:clamp(12px,2.8vh,26px);
}
.icon{
  width:clamp(56px,11vh,84px);
  aspect-ratio:1;
  display:grid;
  place-items:center;
  border-radius:28%;
  background:linear-gradient(145deg,var(--wa),var(--wa-dark));
  box-shadow:
    0 0 0 clamp(6px,1.2vh,10px) rgba(37,211,102,.12),
    0 14px 44px rgba(37,211,102,.32);
}
.icon svg{width:56%;height:56%;fill:#fff}
h1{
  margin:0;
  font-size:clamp(1.55rem,9.2vmin,3.25rem);
  line-height:1.08;
  font-weight:800;
  letter-spacing:-.025em;
  text-wrap:balance;
}
p{
  margin:0;
  max-width:34ch;
  font-size:clamp(.95rem,2.6vh + .4vw,1.2rem);
  line-height:1.5;
  color:var(--ink-soft);
  text-wrap:balance;
}
.cta{
  position:relative;
  isolation:isolate;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:min(100%,460px);
  margin-top:clamp(2px,1vh,10px);
  padding:clamp(16px,2.8vh,24px) 18px;
  border-radius:999px;
  background:linear-gradient(180deg,#3BE57C,var(--wa));
  color:var(--btn-text);
  font-size:clamp(.8rem,3.7vw,1.1rem);
  font-weight:800;
  letter-spacing:.01em;
  line-height:1.15;
  text-decoration:none;
  box-shadow:0 10px 30px rgba(37,211,102,.38),inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .15s ease,box-shadow .15s ease;
  touch-action:manipulation;
}
.cta::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  border-radius:inherit;
  background:var(--wa);
  opacity:0;
  animation:pulse 2.4s ease-out 1s infinite;
}
.cta svg{flex:none;width:1.45em;height:1.45em;fill:currentColor}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(37,211,102,.5),inset 0 1px 0 rgba(255,255,255,.45)}
.cta:active{transform:scale(.98)}
.cta:focus-visible{outline:3px solid #fff;outline-offset:4px}
.note{
  font-size:clamp(.78rem,1.9vh + .3vw,.9rem);
  color:var(--ink-soft);
}
@keyframes pulse{
  0%{opacity:.5;transform:scale(1)}
  70%,100%{opacity:0;transform:scale(1.1,1.4)}
}
@media (max-height:500px){
  main{width:min(100%,680px);gap:10px}
  .icon{display:none}
  h1{font-size:clamp(1.3rem,7vh,1.9rem)}
  p{font-size:.9rem;max-width:56ch}
  .cta{padding:13px 22px;width:min(100%,400px)}
}
@media (prefers-reduced-motion:reduce){
  .cta::after{animation:none}
  .cta{transition:none}
}
</style>
</head>
